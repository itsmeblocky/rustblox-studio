[package]
name = "rbx-studio-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rbx-studio-app"
path = "src/main.rs"

[dependencies]
rbx-studio = { path = "../rbx-studio" }
rbx-core = { path = "../rbx-core" }
rbx-render = { path = "../rbx-render" }
rbx-script = { path = "../rbx-script" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
ureq.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
flate2.workspace = true
image.workspace = true

# Qt UI shell (bootstrap). Requires Qt dev (Qt5/Qt6) discoverable by qmetaobject-rs.
# Current Qt install attempt (background): .tools/Qt/6.8.3/msvc2022_64
qmetaobject = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
